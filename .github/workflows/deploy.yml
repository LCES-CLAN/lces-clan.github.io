# Deploy LCES Clan site to GitHub Pages
# Injects the public form endpoint + Turnstile site key from GitHub Variables
# (and the analytics webhook from Secrets) at deploy time so secrets don't
# live in the public repo.
#
# Required Secrets:
#   WEBHOOK_ANALYTICS_URL — Discord webhook for analytics tracking
#
# Required Variables (Settings → Secrets and variables → Actions → Variables):
#   FORM_ENDPOINT_URL     — Cloudflare Worker URL for guestbook submissions
#   TURNSTILE_SITE_KEY    — Cloudflare Turnstile site key (public)
#
# NOTE: The guestbook Discord webhook URL lives ONLY in Cloudflare as a Worker
# secret (DISCORD_WEBHOOK_URL). It is never injected into the public site.
#
# Set them in: https://github.com/{owner}/{repo}/settings/secrets/actions

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject endpoint + keys
        env:
          FORM_ENDPOINT_URL: ${{ vars.FORM_ENDPOINT_URL }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          ANALYTICS_URL: ${{ secrets.WEBHOOK_ANALYTICS_URL }}
        run: |
          # Replace empty-string placeholders with the real values.
          python3 << 'EOF'
          import os, pathlib

          replacements = [
              (pathlib.Path('scripts/form.js'),     "var FORM_ENDPOINT = ''",      "var FORM_ENDPOINT = '" + os.environ.get('FORM_ENDPOINT_URL', '') + "'"),
              (pathlib.Path('scripts/form.js'),     "var TURNSTILE_SITE_KEY = ''", "var TURNSTILE_SITE_KEY = '" + os.environ.get('TURNSTILE_SITE_KEY', '') + "'"),
              (pathlib.Path('analytics/config.js'), "webhookUrl: ''",              "webhookUrl: '" + os.environ.get('ANALYTICS_URL', '') + "'"),
          ]

          for path, old, new in replacements:
              content = path.read_text()
              if old not in content:
                  print('  [WARN] Pattern "' + old + '" not found in ' + str(path))
                  continue
              content = content.replace(old, new)
              path.write_text(content)
              print('  [OK] ' + str(path))
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
